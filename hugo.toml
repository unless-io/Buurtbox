baseURL = 'https://buurtbox.org/'
title = 'Buurtbox'
author = 'Lars Böhm'
copyright = 'Copyright © 2026, Lars Böhm.'
enableRobotsTXT = true
defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = true

theme = 'hugo-bearblog'

# Required by hugo-bearblog
disableKinds = ['taxonomy']
ignoreErrors = ['error-disable-taxonomy']

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    style = 'friendly'
    lineNos = false
    codeFences = true

[params]
  hideMadeWithLine = false
  favicon = 'images/favicon.svg'
  images = ['images/share.png']

[languages]
  [languages.en]
    label = 'English'
    locale = 'en-US'
    weight = 1
    [languages.en.params]
      description = 'Buurtbox is a plug-and-play offline data hub for neighbourhoods - keeping essential information available when the internet goes down.'
    [[languages.en.menu.main]]
      name = 'Pilot'
      url = 'pilot/'
      weight = 5
    [[languages.en.menu.main]]
      name = 'Blog'
      url = 'posts/'
      weight = 8
    [[languages.en.menu.main]]
      name = 'Concept'
      url = '#concept'
      weight = 10
    [[languages.en.menu.main]]
      name = 'Hardware'
      url = '#hardware'
      weight = 20
    [[languages.en.menu.main]]
      name = 'Features'
      url = '#features'
      weight = 30
    [[languages.en.menu.main]]
      name = 'Planning'
      url = '#planning'
      weight = 40
    [[languages.en.menu.main]]
      name = 'Contact'
      url = '#contact'
      weight = 50

  [languages.nl]
    label = 'Nederlands'
    locale = 'nl-NL'
    weight = 2
    [languages.nl.params]
      description = 'Buurtbox is een plug-and-play offline datahub voor buurten - zodat essentiële informatie beschikbaar blijft wanneer internet uitvalt.'
    [[languages.nl.menu.main]]
      name = 'Pilot'
      url = 'pilot/'
      weight = 5
    [[languages.nl.menu.main]]
      name = 'Blog'
      url = 'posts/'
      weight = 8
    [[languages.nl.menu.main]]
      name = 'Concept'
      url = '#concept'
      weight = 10
    [[languages.nl.menu.main]]
      name = 'Hardware'
      url = '#hardware'
      weight = 20
    [[languages.nl.menu.main]]
      name = 'Functies'
      url = '#features'
      weight = 30
    [[languages.nl.menu.main]]
      name = 'Planning'
      url = '#planning'
      weight = 40
    [[languages.nl.menu.main]]
      name = 'Contact'
      url = '#contact'
      weight = 50
