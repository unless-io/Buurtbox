  name = 'Hardware'
  url = '/#hardware'
  weight = 20

[[menu.main]]
  name = 'Features'
  url = '/#features'
  weight = 30

[[menu.main]]
  name = 'Planning'
  url = '/#planning'
  weight = 40

[[menu.main]]
  name = 'Contact'
  url = '/#contact'
  weight = 50
